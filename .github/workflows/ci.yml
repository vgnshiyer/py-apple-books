name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # macOS: the library targets Apple Books, and path handling (APFS,
    # symlinks) is exercised by the containment tests. Every supported
    # Python, since pathlib's resolve() behaves differently before 3.13.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - name: Run tests against stub Apple Books databases
        # py_apple_books opens these at import time; empty files are valid
        # SQLite databases. A throwaway HOME keeps the tests away from
        # macOS's protected app containers.
        run: |
          export HOME="$RUNNER_TEMP/home"
          d="$HOME/Library/Containers/com.apple.iBooksX/Data/Documents"
          mkdir -p "$d/BKLibrary" "$d/AEAnnotation"
          touch "$d/BKLibrary/BKLibrary-stub.sqlite" "$d/AEAnnotation/AEAnnotation-stub.sqlite"
          python -m pytest -q
